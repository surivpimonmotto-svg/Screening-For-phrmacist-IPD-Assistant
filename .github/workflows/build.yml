# สร้าง index.html ใหม่อัตโนมัติ เมื่อมีการแก้ไฟล์ใน src/ หรือ build.py (รวมถึงแก้ผ่านหน้าเว็บ GitHub)
name: Build index.html
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build
        run: python3 build.py
      - name: Commit index.html ถ้ามีการเปลี่ยนแปลง
        run: |
          if git diff --quiet -- index.html; then echo "index.html ไม่เปลี่ยน"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: สร้าง index.html จาก src (อัตโนมัติ)"
          git pull --rebase origin main
          git push
